name: Integrate chapter canons 18-20

on:
  push:
    branches: ["transfer-ch18-20"]

permissions:
  contents: write

concurrency:
  group: integrate-ch18-20
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout transfer branch
        uses: actions/checkout@v4
        with:
          ref: transfer-ch18-20
          fetch-depth: 0

      - name: Stop until transfer is complete
        id: ready
        shell: bash
        run: |
          if [ ! -f .transfer/READY ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Reconstruct and verify chapter files
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat .transfer/ch18/part-* > /tmp/ch18.b64
          cat .transfer/ch19/part-* > /tmp/ch19.b64
          cat .transfer/ch20/part-* > /tmp/ch20.b64
          base64 -d /tmp/ch18.b64 > /tmp/18_cell_cycle.md
          base64 -d /tmp/ch19.b64 > /tmp/19_sexual_reproduction_genetics.md
          base64 -d /tmp/ch20.b64 > /tmp/20_cell_communities_tissues_stem_cells_cancer.md
          echo "6b4fec084b4f7f46236485f0f09e69db686d4c0abdaf1acb7c8132d7008495cf  /tmp/18_cell_cycle.md" | sha256sum -c -
          echo "8c43a83d56d9b378c07af3d0070043a5fb60b363fc71ff4e0600316201d8c21e  /tmp/19_sexual_reproduction_genetics.md" | sha256sum -c -
          echo "997febf69f7f7f0d754480cb3a6d7eead5dab28a13b0238f87e01d0843b8a983  /tmp/20_cell_communities_tissues_stem_cells_cancer.md" | sha256sum -c -

      - name: Commit chapters to main
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Kavi Science Canon Bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          test "$(git rev-parse HEAD)" = "31d5b4c208e012f73c46021183e7248811a355fa"
          mkdir -p science/chapters

          cp /tmp/18_cell_cycle.md science/chapters/18_cell_cycle.md
          git add science/chapters/18_cell_cycle.md
          git commit -m "science: add Chapter 18 cell cycle canon"

          cp /tmp/19_sexual_reproduction_genetics.md science/chapters/19_sexual_reproduction_genetics.md
          git add science/chapters/19_sexual_reproduction_genetics.md
          git commit -m "science: add Chapter 19 sexual reproduction genetics canon"

          cp /tmp/20_cell_communities_tissues_stem_cells_cancer.md science/chapters/20_cell_communities_tissues_stem_cells_cancer.md
          git add science/chapters/20_cell_communities_tissues_stem_cells_cancer.md
          git commit -m "science: add Chapter 20 cell communities tissues stem cells cancer canon"

          git push origin main

      - name: Remove transfer branch
        if: steps.ready.outputs.ready == 'true' && success()
        shell: bash
        run: git push origin --delete transfer-ch18-20 || true
