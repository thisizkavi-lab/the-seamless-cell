name: Diagnose Chapter Transfer

on:
  push:
    branches:
      - integrate-ch19-20-clean
    paths:
      - '.transfer/**'
      - '.github/workflows/reconstruct-ch19-20.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integrate-ch19-20-clean
      - name: Diagnose chunks
        shell: bash
        run: |
          set +e
          for f in .transfer/ch19/part-* .transfer/ch20/part-*; do
            bytes=$(wc -c < "$f")
            if base64 -d "$f" >/dev/null 2>&1; then state=OK; else state=FAIL; fi
            echo "$f bytes=$bytes mod4=$((bytes % 4)) $state"
          done
