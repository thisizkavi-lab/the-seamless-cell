name: Diagnose Transfer Tails

on:
  push:
    branches:
      - integrate-ch19-20-clean
    paths:
      - '.github/workflows/reconstruct-ch19-20.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integrate-ch19-20-clean
      - name: Show transfer tails
        shell: bash
        run: |
          echo "ch19-tail=$(tail -c 64 .transfer/ch19/part-04)"
          echo "ch20-tail=$(tail -c 64 .transfer/ch20/part-04b)"
          echo "ch19-size=$(wc -c < .transfer/ch19/part-04)"
          echo "ch20-size=$(wc -c < .transfer/ch20/part-04b)"
