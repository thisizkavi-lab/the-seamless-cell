name: Reconstruct Chapters 19-20

on:
  push:
    branches: ["integrate-ch19-20-clean"]
    paths:
      - ".transfer/**"
      - ".github/workflows/reconstruct-ch19-20.yml"

permissions:
  contents: write

jobs:
  reconstruct:
    if: ${{ !contains(github.event.head_commit.message, 'science: add Chapter') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: integrate-ch19-20-clean

      - name: Reconstruct and verify
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p science/chapters
          cat .transfer/ch19/part-* | base64 -d > science/chapters/19_sexual_reproduction_genetics.md
          cat .transfer/ch20/part-* | base64 -d > science/chapters/20_cell_communities_tissues_stem_cells_cancer.md
          echo "8c43a83d56d9b378c07af3d0070043a5fb60b363fc71ff4e0600316201d8c21e  science/chapters/19_sexual_reproduction_genetics.md" | sha256sum -c -
          echo "997febf69f7f7f0d754480cb3a6d7eead5dab28a13b0238f87e01d0843b8a983  science/chapters/20_cell_communities_tissues_stem_cells_cancer.md" | sha256sum -c -

      - name: Commit Chapter 19
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Kavi"
          git config user.email "thisizkavi@gmail.com"
          git add science/chapters/19_sexual_reproduction_genetics.md
          git commit -m "science: add Chapter 19 sexual reproduction genetics canon"

      - name: Commit Chapter 20
        shell: bash
        run: |
          set -euo pipefail
          git add science/chapters/20_cell_communities_tissues_stem_cells_cancer.md
          git commit -m "science: add Chapter 20 cell communities tissues stem cells cancer canon"
          git push origin HEAD:integrate-ch19-20-clean
